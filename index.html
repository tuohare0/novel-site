<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>磕峰牙</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background: #D90000;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
        }

        .page {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
        }

        .name {
            position: absolute;
            top: 7vh;
            left: 8vw;

            font-size: 22px;
            font-weight: normal;
            letter-spacing: 0.08em;
        }

        .note {
            position: absolute;
            top: 8vh;
            right: 12vw;

            font-size: 11px;
            letter-spacing: 0.08em;
        }

        nav {
            position: absolute;
            top: 30vh;
            left: 17vw;

            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;

            font-size: 19px;
            font-weight: normal;
            letter-spacing: 0.02em;

            transition: opacity 0.15s;
        }

        nav a:hover {
            opacity: 0.45;
        }

        .serial {
            margin-left: 0;
        }

        .short {
            margin-left: 42px;
        }

        .other {
            margin-left: 13px;
        }

        .images {
            margin-left: 67px;
        }

        .small {
            position: absolute;
            bottom: 9vh;
            left: 12vw;

            font-size: 10px;
            letter-spacing: 0.12em;
        }

        .year {
            position: absolute;
            bottom: 8vh;
            right: 10vw;

            font-size: 10px;
        }

        @media (max-width: 600px) {

            .name {
                top: 45px;
                left: 30px;
                font-size: 20px;
            }

            .note {
                top: 48px;
                right: 30px;
                font-size: 9px;
            }

            nav {
                top: 30vh;
                left: 55px;
                gap: 25px;
            }

            nav a {
                font-size: 18px;
            }

            .short {
                margin-left: 32px;
            }

            .other {
                margin-left: 8px;
            }

            .images {
                margin-left: 50px;
            }

            .small {
                left: 35px;
                bottom: 55px;
            }

            .year {
                right: 30px;
                bottom: 55px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="name">磕峰牙</div>

    <div class="note">FICTION / IMAGE</div>

    <nav>
        <a class="serial" href="serial.html">连载</a>
        <a class="short" href="short.html">短篇</a>
        <a class="other" href="other.html">其他</a>
        <a class="images" href="images.html">图片</a>
    </nav>

    <div class="small">TEXT / DRAWING / ETC.</div>

    <div class="year">2026</div>

</div>

</body>
</html>
