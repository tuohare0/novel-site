<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>我的作品</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #D90000;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            min-height: 100vh;
            padding: 6vw;
            display: flex;
            flex-direction: column;
        }

        header {
            margin-bottom: 12vh;
        }

        h1 {
            margin: 0;
            font-size: clamp(42px, 8vw, 110px);
            line-height: 0.9;
            font-weight: 700;
            letter-spacing: -0.06em;
        }

        .subtitle {
            margin-top: 25px;
            font-size: 14px;
            letter-spacing: 0.08em;
        }

        nav {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1000px;
        }

        nav a {
            display: block;
            padding: 18px 0;
            border-top: 2px solid #ffffff;
            color: #ffffff;
            text-decoration: none;
            font-size: clamp(30px, 5vw, 72px);
            line-height: 1;
            letter-spacing: -0.04em;
            transition: background 0.15s, color 0.15s, padding-left 0.15s;
        }

        nav a:last-child {
            border-bottom: 2px solid #ffffff;
        }

        nav a:hover {
            background: #ffffff;
            color: #D90000;
            padding-left: 20px;
        }

        footer {
            margin-top: auto;
            padding-top: 15vh;
            font-size: 11px;
            letter-spacing: 0.08em;
        }

        @media (max-width: 600px) {
            .page {
                padding: 30px 25px;
            }

            header {
                margin-bottom: 100px;
            }

            nav a {
                padding: 22px 0;
            }

            footer {
                padding-top: 120px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header>
        <h1>我的作品</h1>
        <div class="subtitle">FICTION / IMAGE / TEXT</div>
    </header>

    <nav>
        <a href="serial.html">连载</a>
        <a href="short.html">短篇</a>
        <a href="other.html">其他</a>
        <a href="images.html">图片</a>
    </nav>

    <footer>
        © 2026
    </footer>

</div>

</body>
</html>
