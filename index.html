<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>菟</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #e00000;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        .page {
            width: 100vw;
            height: 100vh;

            display: grid;
            grid-template-columns: 50% 50%;
        }

        /* 左侧 */

        .left {
            position: relative;
            background: #e00000;
            height: 100vh;
        }

        /* 导航 */

        nav {
            position: absolute;

            left: 10%;
            top: 50%;

            transform: translateY(-50%);

            display: flex;
            flex-direction: column;

            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;

            font-size: 17px;
            font-weight: normal;

            line-height: 1;

            transition: opacity 0.15s;
        }

        nav a:hover {
            opacity: 0.45;
        }

        /* 左下信息 */

        .meta {
            position: absolute;

            left: 10%;
            bottom: 7%;

            display: flex;
            align-items: baseline;
            gap: 16px;

            font-size: 10px;
            letter-spacing: 0.08em;
        }

        .author {
            font-size: 17px;
            letter-spacing: 0.04em;
        }

        /* 右侧图片 */

        .image-area {
            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: #e00000;
        }

        .image-area img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
        }

        /* 手机 */

        @media (max-width: 700px) {

            body {
                overflow: auto;
            }

            .page {
                width: 100%;
                height: auto;
                min-height: 100vh;

                display: grid;
                grid-template-columns: 1fr;
                grid-template-rows: 48vh 52vh;
            }

            .left {
                height: 48vh;
            }

            .image-area {
                height: 52vh;
            }

            nav {
                left: 10%;
                gap: 17px;
            }

            nav a {
                font-size: 16px;
            }

            .meta {
                left: 10%;
                bottom: 8%;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <section class="left">

        <nav>
            <a href="serial.html">连载</a>
            <a href="short.html">短篇</a>
            <a href="other.html">其他</a>
            <a href="images.html">图片</a>
        </nav>

        <div class="meta">
            <span class="author">菟</span>
            <span>FICTION / IMAGE</span>
            <span>2026</span>
        </div>

    </section>


    <section class="image-area">

        <img src="thermal-glow2.png" alt="">

    </section>

</div>

</body>
</html>
