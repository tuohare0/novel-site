<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>磕峰牙</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #D90000;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            position: relative;
            width: 100%;
            min-height: 100vh;
        }

        /* 网站名称 */

        .name {
            position: absolute;
            top: 8vh;
            left: 8vw;

            font-size: 20px;
            font-weight: normal;
            letter-spacing: 0.08em;
        }

        /* 四个导航 */

        nav {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: min(760px, 80vw);

            display: grid;
            grid-template-columns: repeat(4, 1fr);

            border-top: 1px solid #ffffff;
            border-bottom: 1px solid #ffffff;
        }

        nav a {
            position: relative;

            height: 72px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffffff;
            text-decoration: none;

            font-size: 18px;
            font-weight: normal;

            letter-spacing: 0.04em;

            border-left: 1px solid #ffffff;

            transition:
                background 0.15s,
                color 0.15s;
        }

        nav a:first-child {
            border-left: none;
        }

        nav a:hover {
            background: #ffffff;
            color: #D90000;
        }

        /* 小信息 */

        .info-left {
            position: absolute;

            left: 8vw;
            bottom: 8vh;

            font-size: 10px;
            letter-spacing: 0.12em;
        }

        .info-right {
            position: absolute;

            right: 8vw;
            bottom: 8vh;

            font-size: 10px;
            letter-spacing: 0.08em;
        }

        @media (max-width: 600px) {

            .name {
                top: 40px;
                left: 30px;
                font-size: 19px;
            }

            nav {
                width: calc(100vw - 60px);

                grid-template-columns: repeat(2, 1fr);

                border-bottom: none;
            }

            nav a {
                height: 65px;
            }

            nav a:nth-child(1),
            nav a:nth-child(2) {
                border-bottom: 1px solid #ffffff;
            }

            nav a:nth-child(3) {
                border-left: none;
            }

            .info-left {
                left: 30px;
                bottom: 40px;
            }

            .info-right {
                right: 30px;
                bottom: 40px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="name">磕峰牙</div>

    <nav>
        <a href="serial.html">连载</a>
        <a href="short.html">短篇</a>
        <a href="other.html">其他</a>
        <a href="images.html">图片</a>
    </nav>

    <div class="info-left">
        FICTION / IMAGE
    </div>

    <div class="info-right">
        2026
    </div>

</div>

</body>
</html>
